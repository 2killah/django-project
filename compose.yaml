services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_DB_PATH: /data/db.sqlite3
    volumes:
      - shop_data:/data
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_products && python manage.py runserver 0.0.0.0:8000"

volumes:
  shop_data: