{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2e9">
  <title>{% block title %}Место — вещи на каждый день{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'shop/styles.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="{% url 'home' %}">место<span>.</span></a>
    <nav class="main-nav" aria-label="Основная навигация">
      <a href="{% url 'home' %}">Каталог</a>
      <a class="cart-link" href="{% url 'cart' %}">Корзина <span>{{ cart_count }}</span></a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer"><a class="wordmark" href="{% url 'home' %}">место<span>.</span></a><p>Полезные вещи. Ничего лишнего.</p><span>© 2026</span></footer>
</body>
</html>
